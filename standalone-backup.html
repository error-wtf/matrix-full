<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Terminal + Tetris</title>
    <style>
        /* Combined styles for Terminal and Tetris */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
        }
        
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .login-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            text-align: center;
            background: rgba(0, 0, 0, 0.95);
            padding: 60px;
            border: 2px solid #0f0;
            border-radius: 10px;
            box-shadow: 0 0 40px #0f0;
        }
        
        .matrix-title {
            color: #0f0;
            font-size: 48px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px #0f0;
            letter-spacing: 8px;
        }
        
        .login-form input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #0f0;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            text-align: center;
        }
        
        .login-form input::placeholder {
            color: rgba(0, 255, 0, 0.5);
        }
        
        .login-form button {
            width: 100%;
            padding: 15px;
            background: #0f0;
            color: #000;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-form button:hover {
            background: #0c0;
            box-shadow: 0 0 20px #0f0;
        }
        
        .terminal {
            position: relative;
            z-index: 10;
            width: 80%;
            max-width: 1000px;
            height: 75vh;
            margin: 10vh auto;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #0f0;
            border-radius: 8px;
            box-shadow: 0 0 30px #0f0;
            display: flex;
            flex-direction: column;
        }
        
        .terminal-header {
            background: #0f0;
            color: #000;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 6px 6px 0 0;
        }
        
        .terminal-title {
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 2px;
        }
        
        .terminal-buttons span {
            margin-left: 15px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }
        
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            color: #0f0;
            font-size: 14px;
            line-height: 1.8;
        }
        
        .terminal-input-line {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            border-top: 1px solid #0f0;
        }
        
        .prompt {
            color: #0f0;
            margin-right: 10px;
            font-weight: bold;
        }
        
        .terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            outline: none;
        }
        
        .terminal-input::selection {
            background: #0f0;
            color: #000;
        }
        
        .command-line {
            color: #0c0;
            font-weight: bold;
        }
        
        .output-line {
            color: #0f0;
            margin: 5px 0;
        }
        
        .error-line {
            color: #f00;
        }
        
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #000;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #0f0;
            border-radius: 5px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #0c0;
        }
        
        .terminal-input:focus {
            caret-color: #0f0;
        }
        
        /* Tetris Overlay Styles */
        #tetrisContainer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            background: #000;
        }
        
        #tetrisContainer.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #tetrisGame {
            position: relative;
            z-index: 10;
        }
        
        #tetrisCanvas {
            border: 2px solid #0f0;
            box-shadow: 0 0 30px #0f0;
        }
        
        .game-over, .start-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            padding: 40px;
            border: 2px solid #0f0;
            border-radius: 10px;
            box-shadow: 0 0 40px #0f0;
            text-align: center;
            z-index: 100;
        }
        
        .game-over h1, .start-screen h1 {
            color: #0f0;
            font-size: 36px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #0f0;
        }
        
        .game-over button, .start-screen button {
            margin: 10px;
            padding: 15px 30px;
            background: #0f0;
            color: #000;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .game-over button:hover, .start-screen button:hover {
            background: #0c0;
            box-shadow: 0 0 20px #0f0;
        }
    </style>
</head>
<body>
    <!-- Matrix Rain Background -->
    <canvas id="matrixCanvas"></canvas>
    
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <h1 class="matrix-title">MATRIX TERMINAL</h1>
        <div class="login-form">
            <input type="text" id="usernameInput" placeholder="Enter your name..." maxlength="20" autocomplete="off" autofocus>
            <button onclick="login()">CONNECT</button>
        </div>
    </div>

    <!-- Terminal Container -->
    <div id="terminal" class="terminal" style="display: none;">
        <div class="terminal-header">
            <span class="terminal-title">MATRIX TERMINAL v2.0</span>
            <div class="terminal-buttons">
                <span class="btn-close" onclick="logout()">×</span>
                <span class="btn-minimize">−</span>
                <span class="btn-maximize">□</span>
            </div>
        </div>
        <div id="output" class="terminal-output"></div>
        <div class="terminal-input-line">
            <span class="prompt" id="prompt">guest@matrix:~$</span>
            <input type="text" id="commandInput" class="terminal-input" autocomplete="off">
        </div>
    </div>

    <!-- Tetris Container -->
    <div id="tetrisContainer">
        <canvas id="tetrisCanvas" width="350" height="700"></canvas>
        
        <div id="tetrisGameOver" class="game-over" style="display: none;">
            <h1>GAME OVER!</h1>
            <p>Score: <span id="finalScore">0</span></p>
            <p>Level: <span id="finalLevel">0</span></p>
            <button onclick="restartTetris()">RESTART</button>
            <button onclick="closeTetris()">RETURN TO CHAT</button>
        </div>
    </div>

    <script>
        // COMPLETE INLINE JAVASCRIPT WILL GO HERE
        // This is a placeholder - I'll add all the actual code in the next step
        console.log('Standalone Matrix Terminal + Tetris loaded');
    </script>
</body>
</html>
